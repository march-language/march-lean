name: Conformance

# Conformance gate: build march-lean-check (this repo) and march (via
# march-language/setup-march, pinned to a main SHA — see the setup-march
# step below), then run scripts/conformance-harness.sh over march's
# static-semantics corpus and fail the job on any MISMATCH/ERROR/
# MARCH_SELF_INCONSISTENT/CORPUS_VIOLATION/SKIP-LEDGER-MISMATCH/
# KNOWN-LIMITATIONS-STALE.
#
# As of A2-reject the gate is TWO-SIDED: march-lean-check renders its own
# accept/reject verdict (independent HM inference + linearity, ignoring
# march's verdict) on both the accept/ and reject/ corpora, so the harness
# confirms not just that march was right to accept, but that it was right
# to reject. SKIP is still expected and frequent — march-lean-check only
# independently checks a modeled fragment. Two ledgers keep that honest,
# and both are enforced in BOTH directions (a new skip and a stale entry
# each fail the run):
#   - scripts/expected-skips.txt: the accept- AND reject-side skip sets.
#   - scripts/known-limitations.txt: the handful of march=reject files
#     whose rejection reason is erased before --emit-core-ast (so it is
#     structurally invisible to a Core-AST checker) and which A2 therefore
#     wrongly accepts. Gated to march=reject, so it can never mask an
#     accept-side bug.
# See those files' headers and the harness's own comments for the full
# rationale.
on:
  push:
    branches: [main]
    # Also trigger on tag pushes (any ref under refs/tags/) so the
    # tag-triggered release-asset-upload step below is actually reachable —
    # `branches` and `tags` filters on the same `push` trigger are
    # effectively OR'd (a given push is to either a branch or a tag ref, so
    # this doesn't broaden when the `branches: [main]` job steps 1-4 run,
    # only adds tag pushes as an additional trigger).
    tags: ["*"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    # contents: write is only needed for the tag-triggered release-asset
    # upload step at the end (softprops/action-gh-release); everything else
    # in this job only reads.
    permissions:
      contents: write
    steps:
      - name: Checkout march-lean
        uses: actions/checkout@v4

      # Installs elan + the toolchain pinned in lean-toolchain, then runs
      # `lake build MarchLean march-lean-check`. This repo's lakefile.toml has
      # no defaultTargets, so a bare `lake build` (lean-action's default)
      # reports "0 jobs" and silently builds nothing — build-args names the
      # targets explicitly. use-mathlib-cache: false skips the (inapplicable)
      # cache-restore step rather than silently no-op'ing through
      # auto-detection (this repo has no Mathlib dependency).
      #
      # BOTH targets are named on purpose. `MarchLeanCheck.lean` imports the
      # individual modules it needs, NOT the `MarchLean` library root, so
      # building only the executable leaves every module outside the exe's
      # import closure unbuilt — which since P0 includes the proof layer
      # (`MarchLean/Calculus/Verdicts.lean`, `Concrete.lean`). Those files are
      # kernel-checked ONLY if `MarchLean` is built, so dropping it here would
      # let every theorem rot undetected while CI stayed green.
      - name: Install Lean toolchain and build the library and checker
        uses: leanprover/lean-action@v1
        with:
          build-args: MarchLean march-lean-check
          use-mathlib-cache: false

      # Lean treats `sorry` as a WARNING, not an error, so the build above
      # would pass with unproven theorems. The Calculus/ proof layer (P0,
      # specs/plans/2026-08-08-calculus-proof-capabilities-design.md) is only
      # evidence if this gate holds. Source-level grep rather than build-log
      # parsing, so a failure names the offending file:line.
      - name: Forbid sorry/admit in Lean sources
        run: |
          if grep -rnE '\b(sorry|admit)\b' --include='*.lean' MarchLean/ MarchLean.lean MarchLeanCheck.lean; then
            echo "::error::sorry/admit found in Lean sources (see matches above)"; exit 1
          fi

      # Pinned to a march main SHA (not a branch) for reproducibility. This
      # pin (6867c783) is march main HEAD as of the capability resync
      # (2026-08-08); its corpus has grown to 277 files. It supersedes
      # 7c1d701c, which was 71 commits behind.
      #
      # Drift from 7c1d701c was assessed before bumping. Unlike the previous
      # two bumps this one was NOT inert — it surfaced five real divergences,
      # four of them false ACCEPTS, all fixed in the commits that accompany
      # this pin:
      #   - lib/dump/ast_json.ml: CHANGED, but compatibly. format_version is
      #     still 3 (bin/main.ml:1934), and DNeeds.paths still emits the same
      #     array of dotted paths. What is NEW is a parallel `scopes` array
      #     (see below).
      #   - Check 1 now reaches TYPE DECLARATIONS (caps_in_type_def, via the
      #     new lib/caps/cap_surface_ty.ml) and FUNCTION BODIES
      #     (cap_annots_in_expr). Both were holes here; both are now modeled.
      #   - R2: root_cap is no longer an ambient global (typecheck.ml:5118).
      #   - R4a: cap_narrow is now polymorphic and subsumption moved to a
      #     deferred sweep (check_cap_narrow_sites); modeled by
      #     CapCheck.capNarrowViolation.
      #
      # THREE KNOWN GAPS remain against this pin. None is corpus-visible, so
      # a green run is NOT evidence about them — each needs a hand-built
      # probe (see specs/march-findings.md):
      #   - PATH-SCOPED CAPABILITIES. march added `needs IO.FileRead("/etc")`
      #     and emits the scope in a new `scopes` array; Elab's DNeeds
      #     decoder reads only `paths` and drops it. Since scope_subsumes
      #     says a scope never subsumes unscoped, a narrow declaration
      #     decodes here as broad — a FALSE ACCEPT by construction. Zero
      #     corpus files use the syntax today, which is exactly why this is
      #     dangerous rather than reassuring.
      #   - Tagged: march's caps_in_ty now RECURSES into Tagged (its old
      #     `| Tagged -> []` arm is gone, deliberately: skipping it blinded
      #     the walk to Tagged(R, Cap(IO))). CapCheck.capsInTy still mirrors
      #     the old behavior. No corpus witness.
      #   - normalize: march's now dedupes before filtering; ours does not,
      #     so the two differ on duplicate cap lists. Latent only because
      #     normalize is not on this checker's verdict path.
      #
      # Corpus grew 242 -> 277 (+35, heavily capability-focused). The ledger
      # delta is NOT purely additive this time: accept/t49_transitive_use_
      # covered regressed from MATCH to SKIP, and the four CORPUS_VIOLATION
      # entries seen against the old local march 0.2.0 were artifacts of that
      # stale binary and are gone.
      #
      # Bump periodically; no need to chase every push. setup-march builds
      # march from source and caches the result keyed on this SHA (actions/
      # cache under the hood), so repeat runs at the same pin skip the OCaml
      # build entirely.
      - name: Set up March
        id: setup-march
        uses: march-language/setup-march@main
        with:
          march-version: 6867c783fbde7fb8ab58bae4b4fbe36703b626a1

      # Only the static-semantics corpus is needed from march's own repo
      # (the binary itself came from setup-march above); pinned to the
      # exact commit setup-march resolved and built so corpus and binary
      # never drift apart.
      - name: Checkout march corpus (specs/lang/types)
        uses: actions/checkout@v4
        with:
          repository: march-language/march
          ref: ${{ steps.setup-march.outputs.march-version }}
          path: march-checkout
          sparse-checkout: |
            specs/lang/types
          sparse-checkout-cone-mode: false

      # z3: the refinement-type conformance corpus (@types-check, i.e.
      # exactly the specs/lang/types/{accept,reject} corpus this
      # workflow's harness runs over) discharges pre/postcondition +
      # division-safety verification conditions via the `z3` binary on
      # PATH (lib/refine/solver.ml). Without it, refinement checks
      # silently no-op — no build failure, just reject/t71-t73 silently
      # stop being rejected. setup-march doesn't install it since it's a
      # march *runtime* dependency, not a build dependency.
      - name: Install z3
        run: sudo apt-get install -y z3

      - name: Run conformance harness
        run: |
          scripts/conformance-harness.sh \
            --march-bin "$(command -v march)" \
            --corpus-dir "$GITHUB_WORKSPACE/march-checkout/specs/lang/types" \
            --march-lean-check-bin "$GITHUB_WORKSPACE/.lake/build/bin/march-lean-check"

      # Best-effort: publish the built checker as a release asset on tag
      # push. Not part of the conformance gate itself (steps above already
      # ran and passed by the time this executes). Uses
      # softprops/action-gh-release rather than `gh release upload` because
      # the latter only uploads to an *existing* release and fails outright
      # if the pushed tag has no release object yet; this action creates the
      # release for the tag if needed, which is more robust for a plain tag
      # push with no separate "cut a release" step in this repo.
      - name: Upload march-lean-check binary as a release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/.lake/build/bin/march-lean-check
