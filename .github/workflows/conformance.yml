name: Conformance

# Conformance gate: build march-lean-check (this repo) and march (via
# march-language/setup-march, pinned to a main SHA — see the setup-march
# step below), then run scripts/conformance-harness.sh over march's
# static-semantics corpus and fail the job on any MISMATCH/ERROR/
# MARCH_SELF_INCONSISTENT/CORPUS_VIOLATION/SKIP-LEDGER-MISMATCH/
# KNOWN-LIMITATIONS-STALE.
#
# As of A2-reject the gate is TWO-SIDED: march-lean-check renders its own
# accept/reject verdict (independent HM inference + linearity, ignoring
# march's verdict) on both the accept/ and reject/ corpora, so the harness
# confirms not just that march was right to accept, but that it was right
# to reject. SKIP is still expected and frequent — march-lean-check only
# independently checks a modeled fragment. Two ledgers keep that honest,
# and both are enforced in BOTH directions (a new skip and a stale entry
# each fail the run):
#   - scripts/expected-skips.txt: the accept- AND reject-side skip sets,
#     across all FOUR swept corpora — specs/lang/types/{accept,reject}
#     (--corpus-dir) plus specs/lang/grammar/{parse,reject} and
#     specs/lang/golden (--lang-dir). The latter three are directory-
#     qualified in the ledger; see that file's PATH FORMAT note.
#   - scripts/known-limitations.txt: the handful of march=reject files
#     whose rejection reason is erased before --emit-core-ast (so it is
#     structurally invisible to a Core-AST checker) and which A2 therefore
#     wrongly accepts. Gated to march=reject, so it can never mask an
#     accept-side bug.
# See those files' headers and the harness's own comments for the full
# rationale.
#
# A third ledger gates a DIFFERENT question, ahead of the harness:
#   - scripts/decoder-degraded-kinds.txt, enforced by
#     scripts/decoder-coverage.sh, pins every march AST node "kind" that
#     MarchLean/Elab.lean does not decode into a real modelled constructor,
#     and exactly how it degrades. The harness cannot see this: a kind with
#     no decoder arm just makes the file SKIP, which the harness and the
#     skip ledger both read as expected. Two of the worst defects here
#     (ELet, EAnnot) were precisely that, and were found by hand-probing
#     rather than by CI.
on:
  push:
    branches: [main]
    # Also trigger on tag pushes (any ref under refs/tags/) so the
    # tag-triggered release-asset-upload step below is actually reachable —
    # `branches` and `tags` filters on the same `push` trigger are
    # effectively OR'd (a given push is to either a branch or a tag ref, so
    # this doesn't broaden when the `branches: [main]` job steps 1-4 run,
    # only adds tag pushes as an additional trigger).
    tags: ["*"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    # contents: write is only needed for the tag-triggered release-asset
    # upload step at the end (softprops/action-gh-release); everything else
    # in this job only reads.
    permissions:
      contents: write
    steps:
      - name: Checkout march-lean
        uses: actions/checkout@v4

      # Installs elan + the toolchain pinned in lean-toolchain, then runs
      # `lake build march-lean-check`. This repo's lakefile.toml has no
      # defaultTargets, so a bare `lake build` (lean-action's default)
      # reports "0 jobs" and silently builds nothing — build-args names the
      # target explicitly. use-mathlib-cache: false skips the (inapplicable)
      # cache-restore step rather than silently no-op'ing through
      # auto-detection (this repo has no Mathlib dependency).
      - name: Install Lean toolchain and build march-lean-check
        uses: leanprover/lean-action@v1
        with:
          build-args: march-lean-check
          use-mathlib-cache: false

      # Pinned to a march main SHA (not a branch) for reproducibility. This
      # pin (7c1d701c) is march main HEAD as of the post-slice-(c)
      # re-baseline (2026-08-03); its corpus has grown to 242 files. It
      # supersedes 0a119c9d, which was 28 commits behind.
      #
      # Drift from 0a119c9d was assessed before bumping:
      #   - lib/dump/ast_json.ml: UNCHANGED. The emitter envelope is
      #     identical; format_version and module_caps keys untouched.
      #   - typecheck.ml +599, refine_check.ml +870, new precond_infer.ml
      #     (580) — but exactly ONE new Err.error-level check across all of
      #     it: `cap verified` (undischarged return-type constraint). That
      #     is a sixth behavioral capability cap and it is NOT modeled here,
      #     because it requires refinement-obligation discharge, which is
      #     out of fragment. Its corpus files (accept/t132, accept/t135,
      #     reject/t133) skip today for unrelated refinement-syntax reasons
      #     — so we are currently safe by accident, not by design. If those
      #     files ever stop skipping, `cap verified` becomes a live
      #     false-accept source. See specs/march-findings.md.
      #   - march#136 (calls_in_expr now total over Ast.expr) IS included in
      #     this pin. It fixes the blind spot that made our deliberately
      #     total bodyCalls disagree with march on calls nested in tuples,
      #     records, and lambdas.
      #
      # Corpus grew 233 -> 242; all 9 new files skip (refinement-typed) and
      # every pre-existing skip is unchanged, so the ledger delta is purely
      # additive.
      #
      # Bump periodically; no need to chase every push. setup-march builds
      # march from source and caches the result keyed on this SHA (actions/
      # cache under the hood), so repeat runs at the same pin skip the OCaml
      # build entirely.
      - name: Set up March
        id: setup-march
        uses: march-language/setup-march@main
        with:
          march-version: 7c1d701cf561c13ad094845f52175f449e1c1892

      # Only the conformance corpora are needed from march's own repo (the
      # binary itself came from setup-march above); pinned to the exact
      # commit setup-march resolved and built so corpus and binary never
      # drift apart.
      #
      # FOUR corpora are swept now, so all four must be fetched:
      # specs/lang/types/{accept,reject} (via --corpus-dir) plus
      # specs/lang/grammar/{parse,reject} and specs/lang/golden (via
      # --lang-dir). If a --lang-dir subdirectory were missing the harness
      # exits 1 with an explicit error rather than silently scanning less.
      - name: Checkout march corpora (specs/lang)
        uses: actions/checkout@v4
        with:
          repository: march-language/march
          ref: ${{ steps.setup-march.outputs.march-version }}
          path: march-checkout
          sparse-checkout: |
            specs/lang/types
            specs/lang/grammar
            specs/lang/golden
          sparse-checkout-cone-mode: false

      # z3: the refinement-type conformance corpus (@types-check, i.e.
      # exactly the specs/lang/types/{accept,reject} corpus this
      # workflow's harness runs over) discharges pre/postcondition +
      # division-safety verification conditions via the `z3` binary on
      # PATH (lib/refine/solver.ml). Without it, refinement checks
      # silently no-op — no build failure, just reject/t71-t73 silently
      # stop being rejected. setup-march doesn't install it since it's a
      # march *runtime* dependency, not a build dependency.
      - name: Install z3
        run: sudo apt-get install -y z3

      # Decoder-coverage gate. Runs BEFORE the conformance harness on
      # purpose: it re-checks nothing in Lean (it only runs --emit-core-ast
      # and compares two sets), so it finishes in a couple of minutes where
      # the harness takes 15-20, and a decoder gap should surface in that
      # first couple of minutes rather than at the end of a long run.
      #
      # It catches a failure mode the harness structurally CANNOT. When
      # MarchLean/Elab.lean has no arm for a "kind" march emits, the node
      # decodes to `Term.unsupported`, `hasUnsupported` goes true, and
      # march-lean-check honestly exits 2 — a SKIP, which the harness treats
      # as expected (see its A1/A2 note). The skip ledger then observes only
      # that the file's skip status is unchanged. Nothing anywhere reports
      # that the REASON for the skip is a hole in the decoder. That is
      # exactly how ELet and EAnnot survived: both silently discarded a
      # child expression and blinded the CapCheck capability walks, and both
      # were eventually found by hand-probing rather than by CI.
      #
      # Same four corpora and the same flag names the harness gets, so the
      # two can never drift onto different inputs. --histogram prints kind
      # -> occurrence counts into the log for auditing; it is worth the few
      # lines, because rarity is the signal here (EAnnot occurs exactly ONCE
      # across all 334 files, so a corpus sweep is the only thing likely to
      # witness it). --jobs 4 matches the runner's core count:
      # --emit-core-ast costs about a second of fixed startup per file
      # regardless of file size, so the sweep is entirely process-bound and
      # parallelises linearly.
      - name: Check decoder coverage
        run: |
          scripts/decoder-coverage.sh \
            --march-bin "$(command -v march)" \
            --corpus-dir "$GITHUB_WORKSPACE/march-checkout/specs/lang/types" \
            --lang-dir "$GITHUB_WORKSPACE/march-checkout/specs/lang" \
            --march-lean-check-bin "$GITHUB_WORKSPACE/.lake/build/bin/march-lean-check" \
            --jobs 4 \
            --histogram

      - name: Run conformance harness
        run: |
          scripts/conformance-harness.sh \
            --march-bin "$(command -v march)" \
            --corpus-dir "$GITHUB_WORKSPACE/march-checkout/specs/lang/types" \
            --lang-dir "$GITHUB_WORKSPACE/march-checkout/specs/lang" \
            --march-lean-check-bin "$GITHUB_WORKSPACE/.lake/build/bin/march-lean-check"

      # Best-effort: publish the built checker as a release asset on tag
      # push. Not part of the conformance gate itself (steps above already
      # ran and passed by the time this executes). Uses
      # softprops/action-gh-release rather than `gh release upload` because
      # the latter only uploads to an *existing* release and fails outright
      # if the pushed tag has no release object yet; this action creates the
      # release for the tag if needed, which is more robust for a plain tag
      # push with no separate "cut a release" step in this repo.
      - name: Upload march-lean-check binary as a release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/.lake/build/bin/march-lean-check
